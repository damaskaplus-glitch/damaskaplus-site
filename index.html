<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دامسكا بلس</title>
<meta name="description" content="منصة سورية تهدف إلى نشر الوعي والإعلام الحر وتعزيز حرية التعبير وتوفير محتوى هادف يعكس الواقع السوري بموضوعية وشفافية. تسعى إلى تمكين المجتمع السوري من الوصول إلى المعلومات الدقيقة والمستقلة، والتفاعل مع القضايا الاجتماعية والسياسية.">
<meta property="og:title" content="دامسكا بلس">
<meta property="og:description" content="منصة سورية تهدف إلى نشر الوعي والإعلام الحر وتعزيز حرية التعبير وتوفير محتوى هادف يعكس الواقع السوري بموضوعية وشفافية. تسعى إلى تمكين المجتمع السوري من الوصول إلى المعلومات الدقيقة والمستقلة، والتفاعل مع القضايا الاجتماعية والسياسية.">

<style>
:root{--blue:#2F3F57;--yellow:#FFCF50;--cream:#FEF5EF;--sand:#F4E0B2;--bg:var(--cream);--text:var(--blue);--muted:#5C6675;--card:#fff;--line:#E1E5F2}
@media (prefers-color-scheme:dark){:root{--bg:#1C2433;--text:var(--cream);--muted:#AAB8CC;--card:var(--blue);--line:#3A4A63}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
a{color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
.t{margin:0;display:flex;flex-wrap:wrap;justify-content:center;column-gap:calc(var(--h) * .09);max-width:100%}
.ln{display:block;height:var(--h);width:auto;max-width:100%}
header{padding:56px 0 8px;display:flex;flex-direction:column;align-items:center;gap:22px}
.logo{width:min(300px,70vw);height:auto;display:block;border-radius:16px}
.tag{background:var(--yellow);color:var(--blue);border-radius:999px;padding:6px 22px;--h:32px}
.hero{text-align:center;padding:28px 0 8px;display:flex;flex-direction:column;align-items:center;gap:18px}
.h1{--h:clamp(64px,13vw,96px)}
.bio{max-width:660px;--h:clamp(44px,11.7vw,52px)}
.badge{margin:36px auto 0;background:var(--sand);color:var(--blue);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:720px}
.badge .a{--h:clamp(42px,11vw,50px)}
.badge .b{--h:clamp(36px,9vw,42px)}
section{padding:48px 0 0}
.h2{--h:clamp(56px,14vw,68px);margin-bottom:14px}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.soc{background:var(--blue);color:#fff;border-radius:999px;padding:6px 24px;display:inline-flex;--h:42px;text-decoration:none;transition:transform .15s}
@media (prefers-color-scheme:dark){.soc{background:var(--cream);color:var(--blue)}}
.soc:hover{transform:translateY(-2px)}
.soc:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.feed{display:flex;justify-content:center}
.feed iframe{width:100%;max-width:500px;height:640px;border:0;border-radius:14px;background:var(--card)}
footer{margin-top:56px;padding:28px 16px 40px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
footer .f{--h:34px}
footer a{font-size:15px;text-decoration:none}
</style>
